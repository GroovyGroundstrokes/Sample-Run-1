<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1220" />
    <script>
      // Apply the theme before the page paints: saved choice first, else the system setting.
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('fg-theme');
          t = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'light' ? '#F8FAFC' : '#0B1220');
      })();
    </script>
    <title>FinGuard AI: understand your money in plain language</title>
    <meta name="description" content="FinGuard AI reads your statements, explains your spending, income and savings, and flags unusual transactions for you to review." />
    <meta property="og:title" content="FinGuard AI: understand your money in plain language" />
    <meta property="og:description" content="FinGuard AI reads your statements, explains your spending, income and savings, and flags unusual transactions for you to review." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-bg text-ink antialiased selection:bg-primary/20 font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
